[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cbt2git"
version = "1.0.0"
description = "Tools to extract, analyze, and publish CBT Tape files to GitHub"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "parse",
    "pyyaml",
    "PyGithub",
    "xlsxwriter",
    "xmi-reader",
    "python-magic; sys_platform != 'win32'",
    "python-magic-bin; sys_platform == 'win32'"
]

[project.scripts]
cbt-get = "get_cbtzips_locally:main"
cbt-process = "process_local_cbtzips:main"
cbt-analyze = "cbt_analyzer:main"
cbt-catalog = "generate_catalog:main"

[tool.setuptools]
py-modules = [
    "cbt_analyzer",
    "get_cbtzips_locally",
    "process_local_cbtzips",
    "generate_catalog"
]